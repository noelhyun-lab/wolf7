<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Wolfgang's 7th Birthday</title>
<meta property="og:title" content="Wolfgang's 7th Birthday Mission">
<meta property="og:description" content="Fri, Dec 18 · after school until 3pm · Pacaso Westbourne, La Jolla. RSVP by Dec 11.">
<meta property="og:image" content="https://noelhyun-lab.github.io/wolf7/invite.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#070B1A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#070B1A;--panel:#0E1633;--line:#2D4180;--blue:#8FB3FF;--gold:#F2B33D;--fg:#EEF1FA;--muted:#B8C3E3}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Exo 2",system-ui,sans-serif;
padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.side{display:flex;flex-direction:column;gap:14px}
@media (min-width:820px){main{max-width:1000px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:40px;align-items:center;min-height:calc(100vh - 48px)}.rsvp{grid-template-columns:1fr}h2{text-align:left;font-size:17px}.note{text-align:left}.btn{min-height:64px;font-size:19px}}
img{width:100%;height:auto;display:block;border-radius:14px}
.rsvp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:12px 14px;border-radius:14px;
text-decoration:none;font-weight:600;font-size:17px;color:var(--fg);background:var(--panel);border:2px solid var(--line)}
.btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.primary{background:var(--gold);border-color:var(--gold);color:#121212}
h2{margin:4px 0 0;font-family:Orbitron,sans-serif;font-size:15px;letter-spacing:.18em;color:var(--blue);text-align:center}
.note{margin:0;text-align:center;color:var(--muted);font-size:15px;line-height:1.5}
.note a{color:var(--fg)}
@media (max-width:360px){.rsvp{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<img src="invite.jpg" width="1059" height="1486" alt="Starfleet Academy calls all cadets to duty. Join Chief Engineer Wolfgang on his 7th Birthday Mission. Friday, December 18, after 12pm school dismissal until 3:00 pm, at Pacaso Westbourne, 442 Westbourne St, La Jolla. Lunch, moon rocks, and a real rocket launch. Siblings welcome. Adults may stay or drop off. We can bring your cadet over from school, just ask. Please share any food allergies. RSVP by December 11 to Noel, 310-801-3161, noelhyun@gmail.com.">
<div class="side">
<h2>RSVP BY DECEMBER 11</h2>
<div class="rsvp">
<a class="btn primary" href="mailto:noelhyun@gmail.com?subject=RSVP%3A%20Wolfgang%27s%207th%20Birthday&body=Child%27s%20name%3A%20%0AAttending%20%28Yes/No%29%3A%20%0A%23%20of%20kids%20coming%20%28incl.%20siblings%29%3A%20%0A%23%20of%20adults%20coming%3A%20%0ABest%20phone%20or%20email%3A%20%0AFood%20allergies%20or%20need%20a%20ride%20from%20school%3F%3A%20%0A">RSVP by email</a>
<a class="btn primary" href="sms:+13108013161?&body=RSVP%3A%20Wolfgang%27s%207th%20Birthday%0AChild%27s%20name%3A%20%0AAttending%20%28Yes/No%29%3A%20%0A%23%20of%20kids%20coming%20%28incl.%20siblings%29%3A%20%0A%23%20of%20adults%20coming%3A%20%0ABest%20phone%20or%20email%3A%20%0AFood%20allergies%20or%20need%20a%20ride%20from%20school%3F%3A%20%0A">RSVP by text</a>
</div>
<a class="btn" href="https://www.google.com/maps/search/?api=1&query=442%20Westbourne%20St%2C%20La%20Jolla%2C%20CA%2092037" target="_blank" rel="noopener">Map and directions</a>
<p class="note">Noel · 310-801-3161 · <a href="mailto:noelhyun@gmail.com">noelhyun@gmail.com</a></p>
</div>
</main>
</body>
</html>
